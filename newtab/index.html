<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Tab mới</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body data-scene="0">
    <svg class="sprite" aria-hidden="true" focusable="false">
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.4"/><path d="m16 16 4.4 4.4"/></symbol>
        <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M3.6 12h16.8M12 3.6c2.4 2.3 3.7 5.2 3.7 8.4s-1.3 6.1-3.7 8.4c-2.4-2.3-3.7-5.2-3.7-8.4S9.6 5.9 12 3.6Z"/></symbol>
        <symbol id="i-code" viewBox="0 0 24 24"><path d="m9 8-4.5 4L9 16M15 8l4.5 4L15 16"/></symbol>
        <symbol id="i-book" viewBox="0 0 24 24"><path d="M4.5 5.8A2.3 2.3 0 0 1 6.8 3.5H20v16H6.8a2.3 2.3 0 0 0-2.3 2.3V5.8Z"/><path d="M4.5 19.8A2.3 2.3 0 0 1 6.8 17.5H20"/></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.5 5.8v12.4L19 12 8.5 5.8Z"/></symbol>
        <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3.2" y="5.4" width="17.6" height="13.2" rx="2"/><path d="m3.8 7 8.2 5.9L20.2 7"/></symbol>
        <symbol id="i-news" viewBox="0 0 24 24"><path d="M4 4.8h11.6V20H5.5A1.5 1.5 0 0 1 4 18.5V4.8Z"/><path d="M15.6 8h4.2v9.4a1.4 1.4 0 0 1-1.4 1.4h-2.8"/><path d="M7 8.2h5.6M7 11.2h5.6M7 14.2h3.6"/></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.4V12l3.2 2"/></symbol>
    </svg>

    <canvas id="art" aria-hidden="true"></canvas>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
        <a class="brand" href="index.html" id="brand" aria-label="Zephium — tab mới">
            <span class="brand-square" aria-hidden="true">Z</span>
            <span class="brand-name">Zephium</span>
            <span class="brand-slash">/</span>
            <span class="brand-page">tab mới</span>
        </a>

        <nav class="scenes" aria-label="Cảnh nền ASCII">
            <button class="scene" type="button" data-scene="0" aria-pressed="true"><span class="scene-no">01</span>Vịnh trăng</button>
            <button class="scene" type="button" data-scene="1" aria-pressed="false"><span class="scene-no">02</span>Bình minh</button>
            <button class="scene" type="button" data-scene="2" aria-pressed="false"><span class="scene-no">03</span>Cực quang</button>
        </nav>

        <div class="clock">
            <time id="clock" datetime="">--:--</time>
            <span id="date">Đang tải…</span>
        </div>
    </header>

    <main class="stage">
        <section class="hero" aria-labelledby="hero-label">
            <p class="kicker" id="hero-label"><span class="kicker-bracket">[</span> ASCII WALLPAPER <span class="dot">/</span> C17 -&gt; WASM <span class="kicker-bracket">]</span></p>

            <div class="omni-wrap">
            <form class="omnibox" id="search-form" role="search" autocomplete="off" novalidate>
                <span class="omni-icon" aria-hidden="true"><svg><use href="#i-search"></use></svg></span>
                <input id="omnibox" name="q" type="text" inputmode="text"
                       placeholder="Tìm kiếm hoặc nhập địa chỉ…"
                       spellcheck="false" autocapitalize="off" autocorrect="off"
                       aria-label="Tìm kiếm hoặc nhập địa chỉ"
                       aria-expanded="false" aria-controls="suggestions">
                <span class="omni-enter" aria-hidden="true">↵</span>
            </form>

            <div class="suggestions" id="suggestions" role="listbox" aria-label="Gợi ý" hidden></div>
            </div>

            <div class="quick" id="quick">
                <button class="quick-link" type="button" data-url="https://duckduckgo.com" title="DuckDuckGo">
                    <span class="quick-icon"><svg><use href="#i-search"></use></svg></span><span>Tìm</span>
                </button>
                <button class="quick-link" type="button" data-url="https://github.com" title="GitHub">
                    <span class="quick-icon"><svg><use href="#i-code"></use></svg></span><span>Code</span>
                </button>
                <button class="quick-link" type="button" data-url="https://vi.wikipedia.org" title="Wikipedia tiếng Việt">
                    <span class="quick-icon"><svg><use href="#i-book"></use></svg></span><span>Wiki</span>
                </button>
                <button class="quick-link" type="button" data-url="https://www.youtube.com" title="YouTube">
                    <span class="quick-icon"><svg><use href="#i-play"></use></svg></span><span>Video</span>
                </button>
                <button class="quick-link" type="button" data-url="https://mail.google.com" title="Gmail">
                    <span class="quick-icon"><svg><use href="#i-mail"></use></svg></span><span>Thư</span>
                </button>
                <button class="quick-link" type="button" data-url="https://vnexpress.net" title="VnExpress">
                    <span class="quick-icon"><svg><use href="#i-news"></use></svg></span><span>Tin</span>
                </button>
            </div>
        </section>
    </main>

    <footer class="foot">
        <div class="foot-left">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="core-status">C17 core / wasm</span>
            <span class="sep">·</span>
            <span id="scene-meta">Cảnh 01 — Vịnh trăng</span>
            <span class="sep">·</span>
            <span id="grid-meta">0 x 0 ô</span>
        </div>
        <div class="foot-right">
            <span><kbd>/</kbd>tìm kiếm</span>
            <span><kbd>Ctrl</kbd><kbd>T</kbd>tab mới</span>
            <span><kbd>Ctrl</kbd><kbd>L</kbd>thanh địa chỉ</span>
        </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="ascii_core_embed.js"></script>
    <script src="newtab.js"></script>
</body>
</html>
