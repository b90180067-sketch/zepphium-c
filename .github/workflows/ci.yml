name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-modules:
    name: Portable modules + harnesses (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SQLite3 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev

      # Every module is compiled with the project's warning set (-Werror) and its
      # recorded cases are replayed by <module>/harness/diff_runner.c.
      - name: Build modules and run harnesses
        run: |
          set -euo pipefail
          CFLAGS="-std=c17 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wstrict-prototypes -Wformat=2 -Werror -O2"
          SQLITE_CFLAGS="$(pkg-config --cflags sqlite3)"
          SQLITE_LIBS="$(pkg-config --libs sqlite3)"

          run_harness() {
            unit="$1"; shift
            gcc $CFLAGS -I. $SQLITE_CFLAGS "$@" "$unit/harness/diff_runner.c" \
                $SQLITE_LIBS -lm -o "/tmp/harness-$unit"
            ( cd "$unit" && "/tmp/harness-$unit" cases.jsonl )
          }

          run_harness zoom         zoom/port.c
          run_harness geometry     geometry/port.c
          run_harness ids          ids/port.c
          run_harness navigation   navigation/port.c
          run_harness blocker      blocker/port.c
          run_harness store        store/port.c
          run_harness browser_core browser_core/port.c zoom/port.c geometry/port.c \
              ids/port.c navigation/port.c blocker/port.c store/port.c

          # The WebKit ad-block filter cache (manifest parsing, 24h staleness,
          # JSON validation, cache paths, versioned store identifiers) is portable
          # C17 with a standalone test binary - no GTK/WebKit required.
          gcc $CFLAGS -I. blocker/filters.c blocker/harness/filters_test.c \
              -o /tmp/zephium-filters-test
          /tmp/zephium-filters-test
  # The ad-block engine is the only Rust in the tree. It is Linux-testable (the
  # FFI contract is platform neutral) and the Windows shell consumes it as a
  # static archive built for the MinGW target, so prove both.
  adblock-rust:
    name: adblock-rust FFI + Windows staticlib (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Unit tests drive the C ABI exactly like the shells do: block/allow rules,
      # $redirect bodies, binary engine cache, panic containment, thread affinity.
      - name: cargo test (adblock-rust FFI)
        run: cargo test --locked --manifest-path blocker/rust/Cargo.toml

      # Windows shell links the static archive, so a broken cross-target build is
      # a shell build failure. A staticlib needs no Windows linker, only the target.
      - name: Build the MinGW staticlib for the Windows shell
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo build --locked --release --target x86_64-pc-windows-gnu \
            --manifest-path blocker/rust/Cargo.toml
          test -f blocker/rust/target/x86_64-pc-windows-gnu/release/libzephium_adblock.a
